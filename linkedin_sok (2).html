<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn kontaktsøk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f5f5f3;padding:24px;color:#1a1a1a}
h1{font-size:20px;font-weight:500;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#fff;border:0.5px solid #ddd;border-radius:10px;padding:14px 16px}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:500}
.search-row{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;padding:9px 14px;border:0.5px solid #ccc;border-radius:8px;font-size:14px;outline:none}
input[type=text]:focus{border-color:#888}
button{padding:9px 16px;border:0.5px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
button:hover{background:#f0f0f0}
.filter-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:0}
.filter-tag{display:flex;align-items:center;gap:6px;background:#1a1a1a;color:#fff;border-radius:20px;padding:4px 12px;font-size:12px}
.filter-tag span{cursor:pointer;opacity:0.7}
.filter-tag span:hover{opacity:1}
.filter-tag.type-bransje{background:#185FA5}
.filter-tag.type-stilling{background:#0F6E56}
.filter-tag.type-navn{background:#712B13}
.ai-bar{display:flex;gap:8px;align-items:center;background:#fff;border:0.5px solid #ddd;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.ai-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent}
.ai-info{display:none;font-size:13px;color:#555;background:#f0f7ff;border-left:2px solid #378ADD;border-radius:6px;padding:8px 12px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip-label{font-size:12px;color:#888}
.chip{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid #ccc;background:#fff;cursor:pointer}
.chip:hover{background:#f0f0f0}
.contact{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:0.5px solid #eee;border-radius:8px;margin-bottom:6px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{flex:1;min-width:0}
.li-link{font-size:12px;color:#0077b5;text-decoration:none;flex-shrink:0}
.no-res{text-align:center;color:#888;font-size:14px;padding:2rem}
.more{text-align:center;margin:16px 0}
.hint{font-size:12px;color:#aaa;margin-bottom:12px}
</style>
</head>
<body>
<h1>LinkedIn kontaktsøk</h1>
<div class="stats">
  <div class="stat"><div class="stat-label">Totalt</div><div class="stat-val" id="s-total">0</div></div>
  <div class="stat"><div class="stat-label">Vises</div><div class="stat-val" id="s-shown">0</div></div>
  <div class="stat"><div class="stat-label">Selskaper</div><div class="stat-val" id="s-comp">0</div></div>
</div>

<div class="search-row">
  <input type="text" id="q" placeholder="Legg til filter, f.eks. HR, tech, Oslo..." onkeydown="if(event.key==='Enter')addFilter()">
  <button onclick="addFilter()">+ Legg til</button>
  <button onclick="clearAll()">Nullstill</button>
</div>
<p class="hint">Trykk Enter eller klikk "+ Legg til" for å kombinere flere filtre (AND-logikk)</p>
<div class="filter-tags" id="filter-tags"></div>

<div class="ai-bar">
  <span style="font-size:16px">&#10022;</span>
  <input type="text" id="ai-q" placeholder="Eller spør på norsk, f.eks. HR-direktører i tech" onkeydown="if(event.key==='Enter')aiSearch()">
  <button onclick="aiSearch()">Søk</button>
</div>
<div class="ai-info" id="ai-info"></div>

<div class="chips" id="chips">
  <span class="chip-label">Hurtigfilter:</span>
</div>
<div id="list"></div>
<div class="more" id="more-wrap" style="display:none">
  <button onclick="loadMore()">Vis flere</button>
</div>

function expandTerms(q){
  const ql=q.toLowerCase();
  let extra=[];
  for(const [key,terms] of Object.entries(INDUSTRY_MAP)){
    if(ql.includes(key)||terms.some(t=>ql.includes(t.trim()))){
      extra=extra.concat(terms);
    }
  }
  const words=ql.split(/\s+/).filter(w=>w.length>2);
  return [...new Set([...words,...extra])];
}

function matchesFilter(c, f){
  const hay=(c.f+' '+c.l+' '+c.p+' '+c.c).toLowerCase();
  const terms=expandTerms(f);
  return terms.some(t=>hay.includes(t.trim()));
}

function addFilter(){
  const input=document.getElementById('q');
  const val=input.value.trim();
  if(!val)return;
  if(!activeFilters.includes(val)){
    activeFilters.push(val);
    renderTags();
    applyFilters();
  }
  input.value='';
}

function removeFilter(f){
  activeFilters=activeFilters.filter(x=>x!==f);
  renderTags();
  applyFilters();
}

function renderTags(){
  const el=document.getElementById('filter-tags');
  el.innerHTML='';
  activeFilters.forEach(f=>{
    const tag=document.createElement('div');
    tag.className='filter-tag';
    tag.innerHTML=`<span style="opacity:1">${f}</span><span onclick="removeFilter('${f}')" title="Fjern">✕</span>`;
    el.appendChild(tag);
  });
}

function applyFilters(customList){
  const base=customList||CONTACTS;
  if(activeFilters.length===0){filtered=[...base];shown=0;render();return;}
  // AND-logikk: kontakt må matche ALLE filtre
  filtered=base.filter(c=>activeFilters.every(f=>matchesFilter(c,f)));
  shown=0;render();
}

function render(){
  const list=document.getElementById('list');
  list.innerHTML='';
  document.getElementById('s-shown').textContent=filtered.length;
  if(filtered.length===0){list.innerHTML='<div class="no-res">Ingen kontakter funnet</div>';document.getElementById('more-wrap').style.display='none';return;}
  const batch=filtered.slice(0,shown+PAGE);
  batch.forEach(c=>{
    const clr=col(c.f+c.l);
    const d=document.createElement('div');
    d.className='contact';
    d.innerHTML=`<div class="avatar" style="background:${clr.bg};color:${clr.fg}">${ini(c.f,c.l)}</div><div class="info"><div class="name">${c.f} ${c.l}</div><div class="sub">${[c.p,c.c].filter(Boolean).join(' · ')}</div></div>${c.u?`<a class="li-link" href="${c.u}" target="_blank">LinkedIn ↗</a>`:''}`;
    list.appendChild(d);
  });
  shown=batch.length;
  document.getElementById('more-wrap').style.display=shown<filtered.length?'block':'none';
}

function loadMore(){render();}

function clearAll(){
  activeFilters=[];

  filtered=[...CONTACTS];shown=0;render();
}

      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4000,
        messages:[{role:'user',content:`Du er en assistent som filtrerer LinkedIn-kontakter. Brukeren ønsker: "${q}"

Vær inkluderende og tenk bredt. Bruk AND-logikk hvis brukeren kombinerer kriterier (f.eks. "HR i tech" = jobber i tech OG har HR-rolle).

Kontaktliste (Navn|Stilling|Selskap):
${sample}

Returner KUN JSON: {"matches":["Fornavn Etternavn",...],"explanation":"Kort norsk forklaring"}
Ingen markdown, kun ren JSON.`}]
      })
    });
    const data=await res.json();
    const text=data.content?.map(b=>b.text||'').join('')||'';
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    const ms=new Set((parsed.matches||[]).map(n=>n.toLowerCase()));
    const matched=CONTACTS.filter(c=>ms.has((c.f+' '+c.l).toLowerCase().trim()));
    const info=document.getElementById('ai-info');
    info.style.display='block';
    info.textContent=(parsed.explanation||`Fant ${matched.length} kontakter`)+note;
    applyFilters(matched);
  }catch(e){
    document.getElementById('ai-info').style.display='block';
    document.getElementById('ai-info').textContent='Noe gikk galt. Prøv manuelt søk i stedet.';
  }finally{btn.textContent='Søk';btn.disabled=false;}
}

applyFilters();
</script>
